[project]
name = "meeting-forest-mcp"
version = "0.1.0"
description = "FastAPI MCP server for Meeting Forest global AI agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "fastmcp>=2.14.0,<3",
  "httpx>=0.28.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.scripts]
meeting-forest-mcp = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
