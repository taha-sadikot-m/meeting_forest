services:
  - type: web
    name: meeting-forest
    runtime: node
    # Render supplies Bun when bun.lock / .bun-version / BUN_VERSION is present
    buildCommand: bun install
    startCommand: bun run scripts/start-prod.ts
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: "1.3.14"
