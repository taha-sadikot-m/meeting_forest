services:
  - type: web
    name: meeting-forest
    runtime: node
    buildCommand: curl -fsSL https://bun.sh/install | bash && ~/.bun/bin/bun install
    # App + Temporal worker in one free-tier service
    startCommand: ~/.bun/bin/bun run scripts/start-prod.ts
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
